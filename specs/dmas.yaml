# Model spec for PT Puradelta Lestari Tbk (DMAS.IJ), Kota Deltamas.
#
# A property and industrial-estate developer. The template this fills was
# built for an aviation services company, so the accounts a developer reports
# and the accounts it does not are both worth writing down here.
#
# Deltamas reports in FULL RUPIAH: "Kas dan setara kas 1.759.472.182.729".
# The template's columns are in millions of Rupiah, so `target_unit` below
# divides every figure down by a million before it is written. Without it the
# model's numbers would be a million times too large.
#
# The property-specific accounts, and where they go:
#
#   Persediaan appears TWICE: Rp 3.588.031.791.209 in the current section
#     (real-estate inventory) and Rp 1.409.331.434.267 in the non-current
#     section (land held for development). The template has one inventory
#     row, so the current one goes to row 11 and the non-current one to
#     row 25 with the other non-current assets.
#
#   Properti investasi, Investasi dalam ventura bersama and Investasi have
#     no row of their own and go to the non-current and current "other"
#     buckets.
#
#   Uang muka (an asset, advances paid) and Sewa diterima dimuka / Uang
#     muka lain-lain diterima (liabilities, advances received) are the
#     developer's customer advances. The template has "Advances and
#     deposit from customers" at row 36, which is the right home for the
#     liability side; the asset side has no row and goes to row 13.
#
#   Setoran jaminan (security deposits) has no row and goes to row 32.
#
# The income statement maps onto the template well: Deltamas prints
# revenues, cost of revenues and gross profit, which is the structure the
# template expects, unlike CASS which prints a single operating expense.

company: PT Puradelta Lestari Tbk
unit: Rupiah
target_unit: millions of Rupiah
sheet: 3 Statements

header_rows:
  balance_sheet: 5
  income_statement: 68
  cash_flow: 91

check_rows:
  balance: 64
  cash: 145

sections:
  assets.current:
    total: assets.total_current
  assets.non_current:
    total: assets.total_non_current
  assets:
    total: assets.total
  liabilities.current:
    total: liabilities.total_current
  liabilities.non_current:
    total: liabilities.total_non_current
  liabilities:
    total: liabilities.total
  equity.parent:
    total: equity.parent_total
  equity:
    total: equity.total
  income:
    total: income.net_income
  cash:
    total: cash.ending

statements:
  balance_sheet:
    # --- current assets ---------------------------------------------------
    - label: assets.cash_and_equivalents
      section: assets.current
      template_row: 8
      description: Kas dan setara kas / Cash and cash equivalents
    - label: assets.investments_current
      section: assets.current
      template_row: 15
      share: true
      description: Investasi / Investments
    - label: assets.other_receivables
      section: assets.current
      template_row: 10
      description: Piutang lain-lain / Other receivables
    - label: assets.inventories
      section: assets.current
      template_row: 11
      description: Persediaan / Inventories, the current part
    - label: assets.advances
      section: assets.current
      template_row: 13
      share: true
      description: Uang muka / Advances paid
    - label: assets.prepaid_expenses
      section: assets.current
      template_row: 13
      share: true
      description: Biaya dibayar dimuka / Prepaid expenses
    - label: assets.prepaid_taxes
      section: assets.current
      template_row: 12
      description: Pajak dibayar dimuka / Prepaid taxes
    - label: assets.other_current
      section: assets.current
      template_row: 15
      share: true
      description: Aset lain-lain / Other current assets
    - label: assets.total_current
      section: assets.current
      template_row: 16
      is_total: true
      derived: true
      description: Jumlah Aset Lancar / Total current assets
    # --- non-current assets -----------------------------------------------
    - label: assets.joint_venture
      section: assets.non_current
      template_row: 25
      share: true
      description: Investasi dalam ventura bersama / Investment in a joint venture
    - label: assets.inventories_non_current
      section: assets.non_current
      template_row: 25
      share: true
      description: Persediaan / Inventories, the non-current part
    - label: assets.investment_properties
      section: assets.non_current
      template_row: 25
      share: true
      description: Properti investasi / Investment properties
    - label: assets.fixed_assets
      section: assets.non_current
      template_row: 22
      description: Aset tetap / Property, plant and equipment
    - label: assets.right_of_use
      section: assets.non_current
      template_row: 23
      description: Aset hak-guna / Right-of-use assets
    - label: assets.total_non_current
      section: assets.non_current
      template_row: 26
      is_total: true
      derived: true
      description: Jumlah Aset Tidak Lancar / Total non-current assets
    - label: assets.total
      section: assets
      template_row: 27
      is_total: true
      description: JUMLAH ASET / Total assets
    # --- current liabilities ----------------------------------------------
    - label: liabilities.short_term_debt
      section: liabilities.current
      template_row: 30
      description: Utang bank jangka pendek / Short-term bank loan
    - label: liabilities.payables
      section: liabilities.current
      template_row: 31
      description: Utang usaha / Trade accounts payable
    - label: liabilities.taxes_payable
      section: liabilities.current
      template_row: 33
      description: Utang pajak / Taxes payable
    - label: liabilities.accrued_expenses
      section: liabilities.current
      template_row: 34
      description: Beban akrual / Accrued expenses
    - label: liabilities.security_deposits
      section: liabilities.current
      template_row: 32
      share: true
      description: Setoran jaminan / Security deposits
    - label: liabilities.contract_liabilities
      section: liabilities.current
      template_row: 36
      share: true
      description: Liabilitas kontrak / Contract liabilities
    - label: liabilities.other_advances
      section: liabilities.current
      template_row: 36
      share: true
      description: Uang muka lain-lain diterima / Other advances received
    - label: liabilities.rental_advances
      section: liabilities.current
      template_row: 36
      share: true
      description: Sewa diterima dimuka / Rental advances
    - label: liabilities.current_lease_liabilities
      section: liabilities.current
      template_row: 41
      description: Liabilitas sewa yang jatuh tempo dalam waktu satu tahun
    - label: liabilities.other_payables
      section: liabilities.current
      template_row: 32
      share: true
      description: Utang lain-lain / Other payables
    - label: liabilities.total_current
      section: liabilities.current
      template_row: 42
      is_total: true
      derived: true
      description: Jumlah Liabilitas Jangka Pendek / Total current liabilities
    # --- non-current liabilities -------------------------------------------
    # The template has no row for a non-current contract liability, and its
    # non-current rows are bank loans, leases, employee benefits and deferred
    # tax. The account goes to the catch-all rather than into a row that
    # means something else.
    - label: liabilities.contract_liabilities_non_current
      section: liabilities.current
      template_row: 32
      share: true
      description: Liabilitas kontrak - pihak ketiga / Contract liabilities, non-current
    - label: liabilities.long_term_employee_benefits
      section: liabilities.non_current
      template_row: 48
      description: Liabilitas imbalan kerja jangka panjang
    - label: liabilities.total_non_current
      section: liabilities.non_current
      template_row: 50
      is_total: true
      derived: true
      description: Jumlah Liabilitas Jangka Panjang / Total non-current liabilities
    - label: liabilities.total
      section: liabilities
      template_row: 51
      is_total: true
      description: JUMLAH LIABILITAS / Total liabilities
    # --- equity ------------------------------------------------------------
    - label: equity.share_capital
      section: equity.parent
      template_row: 53
      description: Modal ditempatkan dan disetor / Issued and paid-up capital
    - label: equity.paid_in_capital
      section: equity.parent
      template_row: 54
      description: Tambahan modal disetor / Additional paid-in capital
    - label: equity.retained_appropriated
      section: equity.parent
      template_row: 58
      description: Saldo laba - Ditetermined penggunaannya / Appropriated
    - label: equity.retained_unappropriated
      section: equity.parent
      template_row: 59
      description: Saldo laba - Belum ditentukan penggunaannya / Unappropriated
    - label: equity.parent_total
      section: equity.parent
      template_row: 60
      is_total: true
      description: Jumlah Ekuitas yang Dapat Diatribusikan / Total equity attributable
    - label: equity.non_controlling
      section: equity
      template_row: 61
      description: Kepentingan Nonpengendali / Non-controlling interests
    - label: equity.total
      section: equity
      template_row: 62
      is_total: true
      description: JUMLAH EKUITAS / Total equity
    - label: equity.grand_total
      section: equity
      template_row: 63
      is_total: true
      description: JUMLAH LIABILITAS DAN EKUITAS / Total liabilities and equity

  income_statement:
    - label: income.revenues
      section: income
      template_row: 69
      description: PENDAPATAN USAHA / Revenues
    - label: income.cost_of_revenues
      section: income
      template_row: 70
      description: BEBAN POKOK PENDAPATAN / Cost of revenues
    - label: income.gross_profit
      section: income
      template_row: 71
      description: LABA KOTOR / Gross profit
    - label: income.operating_expenses
      section: income
      template_row: 72
      description: Jumlah Beban Usaha / Total operating expenses
    - label: income.operating_profit
      section: income
      template_row: 73
      description: LABA USAHA / Operating profit
    - label: income.finance_income
      section: income
      template_row: 74
      description: Pendapatan bunga / Interest income
    - label: income.other_operating_income
      section: income
      template_row: 76
      description: Penghasilan Lain-lain - Bersih / Other income, net
    - label: income.finance_cost
      section: income
      template_row: 75
      description: Beban bunga dan keuangan lainnya
    - label: income.pretax
      section: income
      template_row: 78
      description: LABA SEBELUM PAJAK / Profit before tax
    - label: income.tax
      section: income
      template_row: 79
      description: BEBAN PAJAK KINI / Current tax expense
    - label: income.net_income
      section: income
      template_row: 80
      is_total: true
      description: LABA TAHUN BERJALAN / Profit for the year
    - label: income.attributable_to_parent
      section: income
      template_row: 83
      description: Kepentingan Owners of the Parent
    - label: income.non_controlling
      section: income
      template_row: 84
      description: Kepentingan non-pengendali / Non-controlling interests
    - label: income.total
      section: income
      template_row: 86
      is_total: true
      derived: true
      description: Net profit attributable, total

  cash_flow:
    - label: cash.operating
      section: cash
      template_row: 112
      check_only: true
      description: Arus Kas Neto dari Aktivitas Operasi
    - label: cash.investing
      section: cash
      template_row: 121
      check_only: true
      description: Arus Kas Neto dari Aktivitas Investasi
    - label: cash.financing
      section: cash
      template_row: 141
      check_only: true
      description: Arus Kas Neto dari Aktivitas Pendanaan
    - label: cash.net_change
      section: cash
      template_row: 142
      check_only: true
      description: Kenaikan (Penurunan) Neto Kas / Net change in cash
    - label: cash.beginning
      section: cash
      template_row: 143
      share: true
      check_only: true
      description: Saldo Kas dan Setara Kas Pada Awal Tahun / Cash at the beginning
    - label: cash.fx_effect
      section: cash
      template_row: 143
      check_only: true
      share: true
      description: Pengaruh perubahan kurs mata uang asing
    - label: cash.ending
      section: cash
      template_row: 144
      check_only: true
      description: Saldo Kas dan Setara Kas Pada Akhir Tahun / Cash at the end
